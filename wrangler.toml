name = "qcm-module4"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Fichiers statiques du frontend (docs/), servis directement par Cloudflare ;
# le Worker (src/worker.js) n'est invoqué que pour les chemins qui ne
# correspondent à aucun fichier statique, c'est-à-dire /api/*.
[assets]
directory = "docs"
binding = "ASSETS"

# Espace de stockage clé-valeur Cloudflare KV, utilisé pour les sessions en
# cours et les résultats enregistrés. Remplacez "id" par l'identifiant réel
# du namespace KV que vous créez à l'étape 2 du README (Workers & Pages > KV).
[[kv_namespaces]]
binding = "QCM_KV"
id = "5a9bc090e00c448585943397e74077da"

# Adresse recevant chaque résultat, et clé d'accès à la page de régénération
# des PDF (/api/admin-regenerate-pdfs). Mises ici plutôt que dans le tableau
# de bord Cloudflare pour qu'elles ne disparaissent jamais après un
# redéploiement et pour éviter toute manipulation de secrets côté dashboard.
[vars]
ADMIN_EMAIL = "amze.clap@gmail.com"
ADMIN_SECRET = "bbf546f6c72a2d54aa3335f0"
